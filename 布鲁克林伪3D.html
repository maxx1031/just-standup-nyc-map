<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brooklyn Ink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=JetBrains+Mono:wght@500;700&family=Permanent+Marker&family=Rubik+Wet+Paint&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Tokens — same ink world as Ink Mode Lab */
  :root {
    --bg: #0B0F0E; --text: #EDF3EF; --muted: #8FA39A;
    --lime: #C6FF3D; --cyan: #5EE6D0; --pink: #FF4FA3; --violet: #8A5CFF; --night: #160616;
    --drip: "Rubik Wet Paint", "Anton", Impact, sans-serif;
    --street: "Bungee", "Anton", Impact, sans-serif;
    --marker: "Permanent Marker", "Space Grotesk", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; place-items: center; background-image: radial-gradient(rgba(198,255,61,.05) 1px, transparent 1px); background-size: 22px 22px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  /* Phone-shaped stage; full screen on a real phone */
  .stage { position: relative; height: min(94dvh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 28px; overflow: hidden; background: #160b34; container-type: size; isolation: isolate; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-shadow: 0 0 0 1px rgba(237,243,239,.09), 0 30px 80px rgba(0,0,0,.6); }
  @media (max-width: 560px) { .stage { width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; } }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; padding: max(5cqw, env(safe-area-inset-top)) 5cqw max(5cqw, env(safe-area-inset-bottom)); }
  .hud button { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 3cqw; }
  .chip { font: 4.4cqw/1 var(--street); color: var(--night); background: var(--pink); padding: 1.6cqw 2.4cqw 1.2cqw; transform: skewX(-14deg) rotate(-3deg); box-shadow: 1cqw 1cqw 0 var(--night); white-space: nowrap; }
  .pill { margin-top: 3.4cqw; display: flex; align-items: center; gap: 1.6cqw; font: 2.8cqw/1 var(--street); padding: 1.6cqw 2.6cqw; border-radius: 99px; background: rgba(22,6,22,.72); transform: skewX(-12deg) rotate(-2deg); white-space: nowrap; }
  .pill i { width: 1.8cqw; height: 1.8cqw; border-radius: 50%; background: var(--lime); box-shadow: 0 0 2cqw var(--lime); }
  .turf { min-width: 27cqw; padding: 2cqw 2.6cqw; border-radius: 3cqw; background: rgba(22,6,22,.72); transform: skewX(-8deg) rotate(2deg); display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 1cqw 2cqw; }
  .turf span { font: 2.6cqw/1 var(--street); color: var(--muted); }
  .turf b { font: 400 8cqw/1 var(--drip); color: var(--lime); text-align: right; font-variant-numeric: tabular-nums; }
  .turf .bar { grid-column: 1 / -1; height: 1.2cqw; border-radius: 1cqw; background: rgba(237,243,239,.14); overflow: hidden; }
  .turf .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--lime), var(--pink)); transition: width .3s; }

  .cap { margin-top: auto; margin-bottom: 4.5cqw; transform: skewX(-12deg) rotate(-4deg); transform-origin: left bottom; }
  .cap h2 { margin: 0; font: 400 13cqw/.95 var(--drip); color: var(--text); text-shadow: 1.2cqw 1.2cqw 0 var(--violet), -.5cqw -.5cqw 0 var(--night); }
  .cap h2 em { font-style: normal; color: var(--lime); }
  .cap p { margin: 2.2cqw 0 0; font: 4.2cqw/1.2 var(--marker); color: var(--cyan); text-shadow: 0 .4cqw 2cqw #000; }
  .cap.swap { animation: wob .5s ease-out; }
  @keyframes wob { 0% { transform: skewX(4deg) rotate(4deg) scale(1.15); opacity: 0; } 60% { transform: skewX(-16deg) rotate(-6deg) scale(.97); opacity: 1; } 100% { transform: skewX(-12deg) rotate(-4deg); } }

  .ctrls { display: flex; gap: 2.6cqw; }
  .btn { height: 13cqw; border-radius: 4cqw; font: 4.4cqw/1 var(--street); display: grid; place-items: center; transform: skewX(-10deg); }
  .ink { flex: 1; background: var(--pink); color: var(--night); box-shadow: 0 1.2cqw 0 #A3236A; }
  .ink:active { transform: skewX(-10deg) translateY(1cqw); box-shadow: none; }
  .sq { width: 15cqw; background: rgba(22,6,22,.8); color: var(--lime); box-shadow: inset 0 0 0 .5cqw var(--lime); font-size: 3.4cqw; }
  .sq.on { background: #ff3b3b; color: #fff; box-shadow: none; }
  .rec { position: absolute; left: 50%; top: 4cqw; transform: translateX(-50%); z-index: 6; font: 700 3cqw var(--mono); background: #ff3b3b; color: #fff; padding: 1.2cqw 2.6cqw; border-radius: 99px; }
  .load { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; text-align: center; padding: 8cqw; background: #160b34; font: 5cqw/1.3 var(--street); color: var(--lime); transition: opacity .4s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <div class="hud">
    <div class="top">
      <div style="display:flex;flex-direction:column;align-items:flex-start">
        <div class="chip">JUST STANDUP</div>
        <div class="pill"><i></i>BROOKLYN · INK MODE</div>
      </div>
      <div class="turf"><span>TURF</span><b id="turf">0%</b><div class="bar"><i id="bar"></i></div></div>
    </div>
    <div class="cap" id="cap"><h2 id="capT"></h2><p id="capS"></p></div>
    <div class="ctrls">
      <button class="btn ink" id="inkBtn">INK IT!</button>
      <button class="btn sq" id="pauseBtn" aria-label="Pause">❚❚</button>
      <button class="btn sq" id="recBtn" aria-label="Record one loop">REC</button>
    </div>
  </div>
  <div class="rec" id="recTag" hidden>● REC</div>
  <div class="load" id="load">MIXING PAINT…</div>
</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

const $ = id => document.getElementById(id);
const INK = ['#C6FF3D', '#FF4FA3', '#5EE6D0', '#8A5CFF'];
const NIGHT = '#160616';
const stage = $('stage'), cv = $('gl');

// Graffiti textures are painted with the web fonts, so wait for them (offline → Impact fallback).
await Promise.race([
  Promise.all(['Rubik Wet Paint', 'Bungee', 'Permanent Marker'].map(f => document.fonts.load(`80px "${f}"`))),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {});

// ---------------------------------------------------------------- 2D paint helpers
function rng(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1883);                      // fixed seed: the city looks the same every load
const pick = a => a[(R() * a.length) | 0];
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k))));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function blob(g, r, rand) {
  const n = 24, p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2; let rr = r * (.8 + .28 * rand());
    if (rand() < .22) rr *= 1.18 + .35 * rand();
    p.push([Math.cos(a) * rr, Math.sin(a) * rr]);

  g.beginPath(); const m = mid(p[n - 1], p[0]); g.moveTo(m[0], m[1]);
  for (let i = 0; i < n; i++) { const q = mid(p[i], p[(i + 1) % n]); g.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); }
  g.closePath();
}
function splat(g, x, y, r, color, o = {}) {
  const rand = o.rand || Math.random;
  g.save(); g.translate(x, y);
  g.fillStyle = shade(color, -.38); g.save(); g.scale(1.07, 1.07); blob(g, r, rand); g.fill(); g.restore();
  g.fillStyle = color; blob(g, r, rand); g.fill();
  for (let i = 0; i < 9; i++) {
    const a = rand() * Math.PI * 2, d = r * (1.1 + rand() * .85);
    g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, r * (.05 + rand() * .12), 0, 7); g.fill();
  }
  if (o.drips) for (let i = 0, k = 2 + (rand() * 3 | 0); i < k; i++) {
    const dx = (rand() - .5) * r * 1.1, len = r * (.5 + rand() * 1.2), w = r * (.08 + rand() * .08);
    g.fillRect(dx - w / 2, 0, w, len); g.beginPath(); g.arc(dx, len, w * .9, 0, 7); g.fill();
  }
  if (o.gloss !== false) { g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.ellipse(-r * .32, -r * .34, r * .2, r * .11, -.6, 0, 7); g.fill(); }
  g.restore();
}
function star(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .3 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function crown(g, x, y, s, color) {     // the NYC crown
  g.save(); g.translate(x, y); g.strokeStyle = color; g.lineWidth = s * .14; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-s, s * .4); g.lineTo(-s, -s * .3); g.lineTo(-s * .5, s * .1); g.lineTo(0, -s * .6); g.lineTo(s * .5, s * .1); g.lineTo(s, -s * .3); g.lineTo(s, s * .4); g.closePath(); g.stroke();
  [[-s, -s * .3], [0, -s * .6], [s, -s * .3]].forEach(([a, b]) => { g.beginPath(); g.arc(a, b - s * .2, s * .11, 0, 7); g.stroke(); });
  g.restore();
}
// A "piece": halo, 3D extrusion, black outline, gradient fill, drips, sparkles.
function piece(g, text, x, y, size, maxW, o = {}) {
  g.save(); g.translate(x, y); g.rotate(o.rot ?? (R() - .5) * .12);
  g.font = `${size}px "${o.font || 'Rubik Wet Paint'}", Impact, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const w = g.measureText(text).width, k = Math.min(1, maxW / (w + size * .3)); g.scale(k, k);
  const [a, b] = o.fill || [INK[0], INK[2]];
  g.lineWidth = size * .28; g.strokeStyle = o.halo || '#EDF3EF'; g.strokeText(text, 0, 0);
  g.fillStyle = o.ext || '#3b145e';
  for (let i = Math.round(size * .12); i > 0; i--) g.fillText(text, i * .8, i);
  g.lineWidth = size * .1; g.strokeStyle = NIGHT; g.strokeText(text, 0, 0);
  const gr = g.createLinearGradient(0, -size / 2, 0, size / 2); gr.addColorStop(0, a); gr.addColorStop(1, b);
  g.fillStyle = gr; g.fillText(text, 0, 0);
  if (o.drips !== false) {
    g.fillStyle = b;
    for (let i = 0; i < 5; i++) { const dx = (R() - .5) * w * .8, len = size * (.2 + R() * .6), dw = size * .05; g.fillRect(dx - dw / 2, size * .3, dw, len); g.beginPath(); g.arc(dx, size * .3 + len, dw * .8, 0, 7); g.fill(); }
  }
  g.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) star(g, (R() - .5) * w * .9, (R() - .5) * size * .6, size * .08);
  g.restore();
}
function tag(g, text, x, y, size, color) {
  g.save(); g.translate(x, y); g.rotate((R() - .5) * .4);
  g.font = `${size}px "Permanent Marker", sans-serif`; g.textAlign = 'center'; g.fillStyle = color; g.fillText(text, 0, 0);
  g.restore();
}
function arch(g, x, y, w, h) { g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + w / 2); g.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w, y + h); g.closePath(); }
function bricks(g, W, H, base, ppu) {
  g.fillStyle = '#2a0f22'; g.fillRect(0, 0, W, H);
  const bh = ppu * .28, bw = ppu * .62;
  for (let y = 0, row = 0; y < H; y += bh, row++)
    for (let x = -(row % 2) * bw / 2; x < W; x += bw) { g.fillStyle = shade(base, (R() - .5) * .3); g.fillRect(x + 1, y + 1, bw - 2, bh - 2); }
}
function windows(g, W, H, ppu, y0, y1) {          // DUMBO warehouse arched windows
  const floorH = 3 * ppu, cols = Math.max(2, Math.floor(W / (2.3 * ppu)));
  const cw = W / cols, ww = cw * .5, wh = floorH * .58;
  for (let fy = y0 + floorH * .2; fy + wh <= y1; fy += floorH)
    for (let c = 0; c < cols; c++) {
      const x = c * cw + (cw - ww) / 2;
      g.fillStyle = '#d9c9e8'; arch(g, x - ppu * .1, fy - ppu * .1, ww + ppu * .2, wh + ppu * .16); g.fill();
      g.fillStyle = R() < .3 ? '#FFE45E' : R() < .5 ? '#2a2550' : '#1b1638'; arch(g, x, fy, ww, wh); g.fill();
      g.fillStyle = '#d9c9e8'; g.fillRect(x + ww / 2 - ppu * .035, fy + ww / 2, ppu * .07, wh - ww / 2); g.fillRect(x, fy + wh * .58, ww, ppu * .06);
    }
}
function fireEscape(g, x, y0, y1, ppu) {
  g.strokeStyle = g.fillStyle = NIGHT; g.lineWidth = ppu * .07;
  const fw = 2.6 * ppu, floorH = 3 * ppu;
  for (let y = y0 + floorH * .85; y < y1; y += floorH) {
    g.fillRect(x - fw / 2, y, fw, ppu * .1);
    g.strokeRect(x - fw / 2, y - ppu * .7, fw, ppu * .7);
    for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(x - fw / 2 + k * fw / 6, y - ppu * .7); g.lineTo(x - fw / 2 + k * fw / 6, y); g.stroke(); }
    g.beginPath(); g.moveTo(x - fw * .4, y); g.lineTo(x + fw * .4, y - floorH + ppu * .1); g.stroke();
  }
}
const TAGS = ['BK', '718', 'DUMBO', 'SQUAT', 'REPS', 'STAND UP', 'GO!', 'NO EXCUSES', 'FRESH', 'KINGS', 'ONE MORE', '10/10', 'YO', 'EAST RIVER'];
// One wall face: bricks, windows, a street-level graffiti band (or a full mural).
function paintWall(w, h, s) {
  const ppu = Math.min(72, 1024 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * ppu); c.height = Math.round(h * ppu); c.ppu = ppu;
  const g = c.getContext('2d'), W = c.width, H = c.height;
  bricks(g, W, H, s.brick || '#7b2b45', ppu);
  const band = s.mural ? 0 : Math.max(H - 4.2 * ppu, H * .45);
  const winTop = s.top ? 3.3 * ppu : 0;
  if (!s.mural) windows(g, W, H, ppu, winTop, band - ppu * .3);
  if (s.fire) fireEscape(g, W * .74, winTop, band, ppu);
  if (s.top) piece(g, s.top, W / 2, 1.7 * ppu, 2.3 * ppu, W * .92, { font: 'Bungee', fill: ['#EDF3EF', '#FF4FA3'], halo: NIGHT, rot: 0, drips: false });
  for (let i = 0; i < 3; i++) splat(g, R() * W, band + R() * (H - band), ppu * (.5 + R() * .9), pick(INK), { gloss: false, drips: true, rand: R });
  for (let i = 0, n = Math.round(W / (ppu * 2.6)); i < n; i++)
    tag(g, pick(TAGS), R() * W, band + ppu * .7 + R() * (H - band - ppu * .9), ppu * (.42 + R() * .35), pick(['#EDF3EF', NIGHT, '#FF4FA3', '#5EE6D0', '#FFE45E']));
  if (s.piece) piece(g, s.piece, W / 2, band + (H - band) * (s.mural ? .42 : .5), (H - band) * (s.mural ? .45 : .62), W * .9, s);
  if (s.sub) tag(g, s.sub, W / 2, H * .8, ppu * .95, '#C6FF3D');
  if (R() < .7) crown(g, ppu + R() * (W - 2 * ppu), band + ppu * .6, ppu * .45, '#FFE45E');
  const gr = g.createLinearGradient(0, H - ppu * 1.2, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, H - ppu * 1.2, W, ppu * 1.2);
  return c;
}

// ---------------------------------------------------------------- renderer / scene
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); }
catch (e) { $('load').textContent = 'WebGL is off in this browser, so the 3D scene cannot run.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#2a0f4a', 70, 340);
const camera = new THREE.PerspectiveCamera(62, 9 / 16, .1, 1500);

function canvasTex(c, repeat) {
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: grad }, o));
const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, o));
const outlineMat = basic(NIGHT, { side: THREE.BackSide });
// Inverted-hull outline with the same thickness on every axis.
function outline(mesh, t = .2) {
  mesh.geometry.computeBoundingBox();
  const s = new THREE.Vector3(); mesh.geometry.boundingBox.getSize(s);
  const o = new THREE.Mesh(mesh.geometry, outlineMat);
  o.scale.set(1 + 2 * t / Math.max(s.x, .01), 1 + 2 * t / Math.max(s.y, .01), 1 + 2 * t / Math.max(s.z, .01));
  mesh.add(o); return mesh;
}
const add = (m, x = 0, y = 0, z = 0) => { m.position.set(x, y, z); scene.add(m); return m; };
const hittable = [], paintables = [];
function paintable(c) {
  const base = document.createElement('canvas'); base.width = c.width; base.height = c.height; base.getContext('2d').drawImage(c, 0, 0);
  const p = { c, g: c.getContext('2d'), base, tex: canvasTex(c), ppu: c.ppu };
  paintables.push(p); return p;
}

// sky dome + pink sun behind Manhattan
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  [[0, '#0d0526'], [.36, '#2a0f4a'], [.46, '#7a2470'], [.5, '#ff4fa3'], [.53, '#3b145e'], [1, '#160b34']].forEach(([k, v]) => gr.addColorStop(k, v));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  var sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), basic('#fff', { map: canvasTex(c), side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -2; scene.add(sky);
  const s = document.createElement('canvas'); s.width = s.height = 256; const h = s.getContext('2d');
  const sg = h.createLinearGradient(0, 0, 0, 256); sg.addColorStop(0, '#FFE45E'); sg.addColorStop(.55, '#FF4FA3'); sg.addColorStop(1, '#8A5CFF');
  h.fillStyle = sg; h.beginPath(); h.arc(128, 128, 124, 0, 7); h.fill();
  h.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) h.fillRect(0, 150 + i * 15, 256, 3 + i * 1.3);
  const sun = add(new THREE.Mesh(new THREE.PlaneGeometry(110, 110), basic('#fff', { map: canvasTex(s), transparent: true, fog: false, depthWrite: false })), -120, 42, -340);
  sun.lookAt(30, 20, 20);
}

scene.add(new THREE.HemisphereLight('#b9a8ff', '#3a1f4a', .7));
scene.add(new THREE.AmbientLight('#ffffff', .55));
const sunLight = new THREE.DirectionalLight('#ffffff', 1.6); sunLight.position.set(-30, 50, -20); scene.add(sunLight);

// ---------------------------------------------------------------- ground, river, waterfront
const cobble = document.createElement('canvas'); cobble.width = cobble.height = 256;
{
  const g = cobble.getContext('2d'); g.fillStyle = '#2a1f45'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 16) for (let x = (y / 16 % 2) * 12; x < 256; x += 24) { g.fillStyle = `hsl(262,22%,${22 + R() * 12}%)`; g.beginPath(); g.roundRect(x + 2, y + 2, 20, 12, 4); g.fill(); }
}
const ground = add(new THREE.Mesh(new THREE.PlaneGeometry(260, 110), toon('#fff', { map: canvasTex(cobble, [260 / 5, 110 / 5]) })), 0, 0, 49);
ground.rotation.x = -Math.PI / 2; hittable.push(ground);

// ink layer over the Brooklyn waterfront (world x -60..60, z -6..30)

let ac;
function sound(vol) {

    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state !== 'running') return;
    const t = ac.currentTime, n = ac.sampleRate * .2 | 0, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = .8; g.gain.value = .5 * vol;
    src.connect(bp).connect(g).connect(ac.destination); src.start(t);
    const o = ac.createOscillator(), og = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(50, t + .18);
    og.gain.setValueAtTime(.45 * vol, t); og.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(og).connect(ac.destination); o.start(t); o.stop(t + .22);

}

const DUR = [4.5, 3.5, 3.5, 4, 4, 4.5, 5], TOTAL = DUR.reduce((a, b) => a + b, 0), N = SHOTS.length;
const v3 = a => new THREE.Vector3(...a);
const posPath = new THREE.CatmullRomCurve3(SHOTS.map(s => v3(s.at)), true, 'centripetal');
const lookPath = new THREE.CatmullRomCurve3(SHOTS.map(s => v3(s.look)), true, 'centripetal');
function camAt(T) {
  let t = ((T % TOTAL) + TOTAL) % TOTAL, i = 0;
  while (t > DUR[i] && i < N - 1) { t -= DUR[i]; i++; }
  const f = Math.min(1, t / DUR[i]), u = (i + f) / N;
  return { i, f, key: i + f, pos: posPath.getPoint(u), look: lookPath.getPoint(u) };
}
// auto ink so the recorded loop shows the game, not just a fly-through
const EVENTS = [3.25, 3.5, 3.75, 4.3, 4.65];
const SQUAT_FROM = 5.35, SQUAT_TO = 6.55;

let shot = -1;
function setCaption(i) {
  $('capT').innerHTML = SHOTS[i].t; $('capS').textContent = SHOTS[i].s;
  const c = $('cap'); c.classList.remove('swap'); void c.offsetWidth; c.classList.add('swap');
}

// ---------------------------------------------------------------- recording (one full loop → file)
let rec = null, recOut = null;
function drawHud2D(g, W, H) {
  const u = W / 100, sk = a => Math.tan(a * Math.PI / 180);
  g.save(); g.translate(5 * u, 6 * u); g.transform(1, 0, sk(-14), 1, 0, 0); g.rotate(-3 * Math.PI / 180);
  g.font = `${4.4 * u}px Bungee, Impact`; g.textBaseline = 'middle';
  const cw = g.measureText('JUST STANDUP').width + 4.8 * u;
  g.fillStyle = NIGHT; g.fillRect(u, u, cw, 6.6 * u); g.fillStyle = '#FF4FA3'; g.fillRect(0, 0, cw, 6.6 * u);
  g.fillStyle = NIGHT; g.fillText('JUST STANDUP', 2.4 * u, 3.6 * u);
  g.restore();
  g.save(); g.translate(W - 5 * u, 7 * u); g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  g.font = `${2.6 * u}px Bungee, Impact`; g.fillStyle = '#8FA39A'; g.fillText('TURF', -14 * u, 0);
  g.font = `${8 * u}px "Rubik Wet Paint", Impact`; g.fillStyle = '#C6FF3D'; g.fillText(Math.round(turf) + '%', 0, 2 * u);
  g.restore();
  const s = SHOTS[Math.max(0, shot)], lines = s.t.replace(/<\/?em>/g, '').split('<br>');
  g.save(); g.translate(5 * u, H - 16 * u); g.transform(1, 0, sk(-12), 1, 0, 0); g.rotate(-4 * Math.PI / 180);
  g.font = `${13 * u}px "Rubik Wet Paint", Impact`;
  lines.forEach((ln, i) => {
    const y = -(lines.length - i) * 12.4 * u;
    g.fillStyle = '#8A5CFF'; g.fillText(ln, 1.2 * u, y + 1.2 * u);
    g.fillStyle = i === lines.length - 1 ? '#C6FF3D' : '#EDF3EF'; g.fillText(ln, 0, y);
  });
  g.font = `${4.2 * u}px "Permanent Marker", sans-serif`; g.fillStyle = '#5EE6D0'; g.fillText(s.s, 0, 2 * u);
  g.restore();
}
function toggleRec() {
  if (rec) { rec.stop(); return; }
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { $('recTag').hidden = false; $('recTag').textContent = 'Recording not supported here'; setTimeout(() => $('recTag').hidden = true, 2500); return; }
  const rc = document.createElement('canvas'); rc.width = cv.width; rc.height = cv.height;
  recOut = { rc, g: rc.getContext('2d') };
  const chunks = [];
  rec = new MediaRecorder(rc.captureStream(30), { mimeType: type, videoBitsPerSecond: 10e6 });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'brooklyn-ink.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();
    rec = recOut = null; $('recBtn').classList.remove('on'); $('recBtn').textContent = 'REC'; $('recTag').hidden = true;
  };
  T = 0; loopN = 0; prevKey = -1; resetInk(); paused = false; $('pauseBtn').textContent = '❚❚';
  rec.start(250);
  $('recBtn').classList.add('on'); $('recBtn').textContent = '■'; $('recTag').hidden = false;
  setTimeout(() => rec && rec.stop(), TOTAL * 1000 + 300);
}

// ---------------------------------------------------------------- input
cv.addEventListener('pointerdown', e => {
  wakeAudio();
  const r = cv.getBoundingClientRect();
  throwAt(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1));
});
let paused = false;
$('inkBtn').onclick = () => { wakeAudio(); volley(6); };
$('pauseBtn').onclick = () => { paused = !paused; $('pauseBtn').textContent = paused ? '▶' : '❚❚'; };
$('recBtn').onclick = () => { wakeAudio(); toggleRec(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); $('inkBtn').click(); }
  if (e.key === 'p' || e.key === 'P') $('pauseBtn').click();
  if (e.key === 'r' || e.key === 'R') $('recBtn').click();
});

function resize() {
  const r = stage.getBoundingClientRect(); if (!r.width) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.fov = camera.aspect < .5 ? 68 : 62; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let T = 0, loopN = 0, prevKey = -1, sqT = 0, lastRep = 0, first = true;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, clock.getDelta());
  if (!paused) T += dt;
  const n = Math.floor(T / TOTAL);
  if (n !== loopN) { loopN = n; prevKey = -1; resetInk(); }
  const c = camAt(T);
  camera.position.copy(c.pos); camera.lookAt(c.look);
  if (c.i !== shot) { shot = c.i; setCaption(shot); }
  if (!paused) {
    EVENTS.forEach(k => { if (prevKey < k && c.key >= k) volley(3, true); });
    prevKey = c.key;
    sqT += dt;
    const ph = (sqT % 1.4) / 1.4, k = Math.sin(ph * Math.PI);
    upper.position.y = -.55 * k; legs.scale.y = 1 - .42 * k; upper.position.z = .15 * k;
    const rep = Math.floor(sqT / 1.4);
    if (rep !== lastRep) { lastRep = rep; if (c.key > SQUAT_FROM && c.key < SQUAT_TO) squatBurst(); }
    waterTex.offset.x += dt * .01; waterTex.offset.y += dt * .025;
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; b.t += dt / b.dur; const t = Math.min(1, b.t);
    b.m.position.lerpVectors(b.from, b.to, t); b.m.position.y += b.arc * 4 * t * (1 - t);
    if (b.t >= 1) { scene.remove(b.m); b.m.material.dispose(); balls.splice(i, 1); b.onHit(); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt; r.m.scale.setScalar(1 + r.t * 8); r.m.material.opacity = Math.max(0, 1 - r.t / .8);
    if (r.t > .8) { scene.remove(r.m); ripples.splice(i, 1); }
  }
  ring.scale.setScalar(1 + .07 * Math.sin(clock.elapsedTime * 4));
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  if (recOut) { recOut.g.drawImage(cv, 0, 0); drawHud2D(recOut.g, recOut.rc.width, recOut.rc.height); }
  if (first) { first = false; $('load').style.opacity = 0; setTimeout(() => $('load').hidden = true, 450); }
}
// ?embed hides this page's HUD so motion/play.html can sit on top and drive the ink
const qs = new URLSearchParams(location.search);
if (qs.has('embed')) document.querySelector('.hud').style.display = 'none';
const ndc = (x, y) => new THREE.Vector2(x, y);
window.ink = {
  punch(kind) {   // straight → middle of the wall, uppercut → high on the wall
    if (kind === 'upper') throwAt(ndc((Math.random() - .5) * .5, .35 + Math.random() * .25), true);
    else throwAt(ndc((Math.random() - .5) * .6, -.1 + Math.random() * .25), true);
  },
  shot(swish) {   // a lob to the top of the wall; swish adds a burst around it
    throwAt(ndc((Math.random() - .5) * .3, .55), true);
    if (swish) setTimeout(() => volley(6, true), 250);
  },
  turf: () => turf,
  reset: resetInk
};
// ?t=20 jumps to second 20 of the loop and holds there (for rehearsal / screenshots)
const jump = parseFloat(qs.get('t'));
if (jump >= 0) { T = jump; loopN = Math.floor(T / TOTAL); prevKey = camAt(T).key; $('pauseBtn').click(); }
tick();
</script>
</body>
