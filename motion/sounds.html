<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声音试听</title>
<style>
:root{
  --bg:#0B0F0E; --panel:#141A18; --line:rgba(237,243,239,.10);
  --fg:#EDF3EF; --mute:#8FA39A;
  --lime:#C6FF3D; --pink:#FF4FA3; --cyan:#5EE6D0; --yellow:#FFE45E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:20px 16px 40px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px}
p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
h2{margin:6px 0 0;font-size:13px;letter-spacing:.1em;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
button{font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:96px;transition:transform .08s,border-color .2s}
button:active{transform:scale(.96)}
button.on{border-color:var(--c,var(--lime));box-shadow:0 0 0 2px var(--c,var(--lime)) inset}
button b{font-size:20px;color:var(--c,var(--fg))}
button span{font-size:12.5px;color:var(--mute);line-height:1.4}
button small{font-size:11px;color:var(--c,var(--lime));font-weight:700;margin-top:auto}
.key{font-family:ui-monospace,monospace;font-size:11px;color:var(--mute);float:right}
</style>
</head>
<body>
<h1>声音试听</h1>
<p>点一下就播放。电脑上也可以按每张卡片右上角的数字键。听完告诉我：直拳、勾拳、出手、空心分别用哪个。</p>
<div id="app"></div>

<script>
// 和 motion-lab.html 里的 SFX 完全同一套合成代码，这里听到的就是手机上的声音
let ac = null, noiseBuf = null;
let master = null;   // 总限幅器：几层叠加也不会爆音
// 用软削波当限幅器（压缩器会把清脆的起头压扁）：小声几乎不变，大声平滑地贴到 1 以下
function masterOut(ctx) {
  const pre = ctx.createGain(), ws = ctx.createWaveShaper(), c = new Float32Array(1025);
  for (let i = 0; i < 1025; i++) c[i] = Math.tanh(2.2 * (i / 512 - 1));
  pre.gain.value = 0.5; ws.curve = c; pre.connect(ws).connect(ctx.destination); return pre;
}
function init() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
  master = master || masterOut(ac);
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
}
function noise(t, out, { type = 'bandpass', f0 = 1000, f1 = f0, q = 0.8, vol = 1, dur = 0.15 }) {
  const n = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(fl).connect(g).connect(out); n.start(t); n.stop(t + dur + 0.05);
}
function tone(t, out, { type = 'sine', f0 = 440, f1 = f0, vol = 0.8, dur = 0.2 }) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
}
function cheer(t, o, speed, pitch) {
  const n = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), d = 1.1 / speed;
  n.buffer = noiseBuf; n.loop = true; fl.type = 'bandpass'; fl.frequency.value = 1100 * pitch; fl.Q.value = 0.6;
  g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.15 / speed); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  n.connect(fl).connect(g).connect(o); n.start(t); n.stop(t + d + 0.1);
}

const vbuf = {};
async function voiceBuf(name) {
  if (vbuf[name]) return vbuf[name];
  const bin = Uint8Array.from(atob(VOICE[name]), c => c.charCodeAt(0)).buffer;
  return vbuf[name] = await new Promise((ok, no) => ac.decodeAudioData(bin, ok, no));
}
// 人群：三层不同频段的噪声，各自随机起伏（像很多人在喊），再加两声口哨
function crowd(t, o, dur = 1.6, vol = 0.7) {
  [[500, 0.5], [900, 0.6], [1700, 0.35]].forEach(([f, v]) => {
    const n = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), am = ac.createGain();
    const lfo = ac.createOscillator(), lg = ac.createGain();
    n.buffer = noiseBuf; n.loop = true; n.loopStart = Math.random() * 0.2;
    fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 0.9;
    lfo.frequency.value = 5 + Math.random() * 7; lg.gain.value = 0.35; lfo.connect(lg).connect(am.gain); am.gain.value = 0.65;
    g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(v * vol, t + 0.25);
    g.gain.setValueAtTime(v * vol, t + dur * 0.45); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(fl).connect(am).connect(g).connect(o); n.start(t); lfo.start(t); n.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
  });
  [0.15, 0.45].forEach(d => tone(t + d, o, { f0: 1100 + Math.random() * 300, f1: 1700, vol: 0.08, dur: 0.35 }));
}
async function unbelievable(o, name, withCrowd = true) {
  const buf = await voiceBuf(name), t = ac.currentTime + 0.01;
  const src = ac.createBufferSource(), dry = ac.createGain(), dl = ac.createDelay(), fb = ac.createGain(), lp = ac.createBiquadFilter();
  src.buffer = buf; dry.gain.value = 1.6;
  dl.delayTime.value = 0.11; fb.gain.value = 0.35; lp.type = 'lowpass'; lp.frequency.value = 2500;
  src.connect(dry).connect(o);
  dry.connect(dl); dl.connect(lp).connect(fb).connect(dl); lp.connect(o);   // 体育馆回声
  src.start(t);
  if (withCrowd) crowd(t + 0.05, o, buf.duration + 1.0);
}

// 持续音（有起音、保持、释放），用来做铜管和喇叭
function hold(t, o, { type = 'sawtooth', f = 440, dur = 0.3, vol = 0.3, lp = 2500, det = 6 }) {
  const g = ac.createGain(), fl = ac.createBiquadFilter();
  fl.type = 'lowpass'; fl.frequency.value = lp;
  g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.08);
  [0, det].forEach(d => { const x = ac.createOscillator(); x.type = type; x.frequency.value = f; x.detune.value = d; x.connect(fl); x.start(t); x.stop(t + dur + 0.1); });
  fl.connect(g).connect(o);
}
/* ---- 锣鼓：鼓 = 下滑的低音 + 鼓皮噪声；锣 = 一组不成倍数的泛音，慢慢衰减、音高往下沉；
   镲 = 六个方波金属音（TR-808 的做法）过高通 ---- */
function drum(t, o, v = 1) {
  tone(t, o, { f0: 130, f1: 55, vol: v, dur: 0.5 });
  tone(t, o, { type: 'triangle', f0: 200, f1: 90, vol: v * 0.3, dur: 0.15 });
  noise(t, o, { type: 'lowpass', f0: 700, f1: 200, vol: v * 0.6, dur: 0.07 });
}
function gong(t, o, base = 190, dur = 1.8, v = 0.5, bend = 0.97) {

const app = document.getElementById('app'), keys = [];
GROUPS.forEach(([title, color, items]) => {
  const h = document.createElement('h2'); h.textContent = title; app.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid'; grid.style.marginTop = '8px'; app.appendChild(grid);
  items.forEach(([id, name, desc, use]) => {
    const b = document.createElement('button'), k = keys.length + 1;
    b.style.setProperty('--c', color);
    b.innerHTML = '<b>' + name + (k <= 9 ? '<i class="key">' + k + '</i>' : '') + '</b><span>' + desc + '</span><small>' + use + '</small>';
    b.onclick = () => {
      init();
      const out = ac.createGain(); out.gain.value = 0.9; out.connect(master);
      SFX[id](ac.currentTime, out);
      b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 350);
    };
    keys.push(b); grid.appendChild(b);
  });
});
addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= 9 && keys[n - 1]) keys[n - 1].click(); });
